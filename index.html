<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harry Chen's Home Kitchen recipes</title>
  <meta name="description" content="Home-cooked recipes from Harry Chen's hc_ooks cooking videos on YouTube, TikTok and Instagram.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to recipes</a>

  <header class="masthead">
    <div class="utility wrap">
      <nav class="utility-links" id="utility-links" aria-label="Social links"></nav>
    </div>
    <a href="#/" class="wordmark" aria-label="Home">
      <span class="wm-bold">hc_ooks</span><span class="wm-light">KITCHEN</span>
    </a>
    <div class="search-row wrap">
      <label for="search" class="search-label">Search</label>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Recipes, ingredients and more…" autocomplete="off">
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Home view -->
    <section id="home-view">
      <nav class="crumbs wrap" aria-label="Breadcrumb"><a href="#/">Home</a><span aria-hidden="true">›</span><span>Recipes</span></nav>

      <section class="about band" aria-labelledby="intro-name">
        <div class="wrap about-inner">
          <img id="intro-photo" class="about-photo" src="" alt="" width="460" height="460">
          <div class="about-text">
            <h1 id="intro-name"></h1>
            <p class="byline">By <strong>Harry Chen</strong></p>
            <p id="intro-bio" class="about-bio"></p>
            <div class="social" id="intro-links"></div>
          </div>
        </div>
      </section>

      <section class="listing wrap" aria-label="Recipes">
        <div class="listing-head">
          <h2>All recipes</h2>
          <span id="count" class="count"></span>
        </div>
        <div class="filters">
          <span class="filters-label">Filter by</span>
          <div class="chips" id="tag-filter" role="group" aria-label="Filter by tag"></div>
          <button id="clear" class="clear" hidden>Clear all</button>
        </div>
        <ul class="recipe-list" id="recipe-list"></ul>
        <p class="empty" id="empty" hidden>No recipes match that. Try a different word or remove a filter.</p>
      </section>
    </section>

    <!-- Single recipe view -->
    <article id="recipe-view" class="recipe" hidden></article>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <a href="#/" class="wordmark small" aria-label="Home"><span class="wm-bold">hc_ooks</span><span class="wm-light">KITCHEN</span></a>
      <p>Made with love and peace (and more love)</p>
    </div>
  </footer>

  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
